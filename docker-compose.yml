services:
  db:
    image: postgres:18
    container_name: elchemist_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: elchemist_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: